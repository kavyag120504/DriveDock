# DriveDock STUDENT PILOT API on Render (free plan). Synthetic data, test payments only.
# Deploy: Render dashboard → New → Blueprint → this repo, branch pilot/20261116.
# Secrets are generated by Render (generateValue) or pasted in the dashboard (sync: false);
# none are stored in this file.
services:
  - type: web
    name: drivedock-pilot-api
    runtime: docker
    plan: free
    region: singapore
    branch: pilot/20261116
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    autoDeploy: false
    envVars:
      # Development mode on purpose: production mode refuses to start while payments/SMS/registry
      # are sandboxes, and that guard stays as it is. Every secret below is still random.
      - key: NODE_ENV
        value: development
      - key: DEMO_MODE
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      # Render free has a temporary disk; keep uploaded certificates in Atlas (GridFS) instead
      - key: UPLOAD_STORAGE
        value: gridfs
      # Render free has a fraction of one CPU; OCR of an RC photo takes far longer than on a laptop
      - key: OCR_TIMEOUT_MS
        value: "45000"
      - key: MONGO_URI
        sync: false # Atlas connection string ending in /drivedock_pilot_20261116
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: INTERNAL_JOB_SECRET
        generateValue: true
      - key: TRANSFER_SECRET
        generateValue: true
      - key: TWIN_SHARE_SECRET
        generateValue: true
      - key: PAPERWORK_ENCRYPTION_KEYS
        sync: false # "pilot1:<base64 of 32 random bytes>" from server/.env.render
      - key: PAPERWORK_ENCRYPTION_ACTIVE_KEY_ID
        value: pilot1
